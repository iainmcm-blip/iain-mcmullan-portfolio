<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masthead 3: Living grid</title>
<link href="https://api.fontshare.com/v2/css?f[]=zodiak@300,301&f[]=switzer@300,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.mast{background:var(--paper)}
.head{width:min(520px,34vw);top:24vh}
.grid{position:absolute;left:40%;right:var(--g);top:96px;bottom:48px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:8px}
.tile{position:relative;overflow:hidden;background:#E2DCCF;display:block;text-decoration:none;opacity:0;transform:translateY(12px);transition:opacity .8s,transform 1s var(--ease)}
.tile.in{opacity:1;transform:none}
.tile img,.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) sepia(.3) brightness(1.4) contrast(.62);transition:filter 1.4s ease}
.tile video{opacity:0;transition:opacity .5s,filter 1.4s ease}
.tile.dev img,.tile.dev video{filter:none;transition:filter .5s ease}
.tile.dev video{opacity:1}
.tile .cap{position:absolute;left:8px;right:8px;bottom:7px;z-index:2;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);font-size:9px;opacity:0;transition:opacity .4s}
.tile.dev .cap{opacity:1}
.tile:nth-child(1){grid-column:span 2;grid-row:span 2}
.tile:nth-child(6){grid-column:span 2}
@media (max-width:900px){.head{width:auto}.grid{left:var(--g);top:60vh;bottom:64px;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}.tile:nth-child(n+7){display:none}.tile:nth-child(1){grid-row:auto;grid-column:auto}.tile:nth-child(6){grid-column:auto}}
</style>
</head>
<body>
<section class="mast" id="mast" aria-label="Selected work">
  <div class="head">
    <p class="kicker mono">Twelve of 56 pieces &middot; 2005 to 2026</p>
    <h1>Twenty years of work. <em>Developed.</em></h1>
    <p>Strategy, words and websites for brands in the Gulf and Asia.</p>
    <div class="cta mono"><a class="btn solid" href="../portfolio.html">See the work</a></div>
  </div>
  <div class="grid" id="grid"></div>
</section>
<section class="rest"><p>Every tile waits as a pale print and develops, film playing, under the cursor. One develops on its own every few seconds so the grid is never still.</p></section>
<script src="shell.js"></script>
<script src="pieces.js"></script>
<script>
(() => {
  const grid = document.getElementById('grid');
  grid.innerHTML = PIECES.slice(0, 11).map(p => `<a class="tile" href="${CS + p.cs}"><img src="${A + p.img}" alt="${p.title}">${p.vid ? `<video muted loop playsinline preload="none" data-src="${A + p.vid}"></video>` : ''}<span class="cap mono">${p.year} &middot; ${p.title}</span></a>`).join('');
  const tiles = [...grid.children];
  const dev = (t, on) => { t.classList.toggle('dev', on); const v = t.querySelector('video'); if (!v) return; if (on) { if (!v.src) v.src = v.dataset.src; v.play().catch(() => {}); } else v.pause(); };
  tiles.forEach((t, i) => {
    setTimeout(() => t.classList.add('in'), reduceMotion ? 0 : 150 + i * 90);
    t.addEventListener('mouseenter', () => dev(t, true));
    t.addEventListener('mouseleave', () => dev(t, false));
  });
  // The first tile develops once everything is down; then one tile at a time, on its own.
  if (reduceMotion) return;
  setTimeout(() => dev(tiles[0], true), 1500);
  let k = 0, cur = tiles[0];
  setInterval(() => {
    if (grid.matches(':hover')) return;
    dev(cur, false);
    k = (k + 1 + Math.floor(Math.random() * 3)) % tiles.length;
    cur = tiles[k]; dev(cur, true);
  }, 3200);
})();
</script>
</body>
</html>
