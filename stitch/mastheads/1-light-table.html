<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masthead 1: Light table</title>
<link href="https://api.fontshare.com/v2/css?f[]=zodiak@300,301&f[]=switzer@300,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.mast{background:var(--paper) radial-gradient(120% 90% at 70% 40%,#F3EFE6 0,#E6E0D4 100%)}
.print{position:absolute;will-change:transform}
.card{background:#FBF9F4;padding:7px 7px 22px;box-shadow:0 2px 3px rgba(40,30,20,.12),0 18px 34px -18px rgba(40,30,20,.45);transition:transform .45s var(--ease),box-shadow .45s var(--ease);cursor:pointer;display:block;text-decoration:none;color:var(--ink)}
.card .ph{display:block;position:relative;aspect-ratio:3/2;overflow:hidden;background:#ddd}
.card img,.card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card video{opacity:0;transition:opacity .4s}
.card .cap{display:block;margin-top:6px;font-size:8.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.print:hover{z-index:30}
.print:hover .card{transform:translateY(-10px) rotate(0deg) scale(1.08)!important;box-shadow:0 2px 3px rgba(40,30,20,.12),0 40px 60px -24px rgba(40,30,20,.55)}
.print:hover video{opacity:1}
</style>
</head>
<body>
<section class="mast" id="mast" aria-label="Selected work">
  <div class="head">
    <p class="kicker mono">Twelve of 56 pieces <b>&middot;</b> 2005 to 2026</p>
    <h1>Twenty years of work. <em>The ones worth circling.</em></h1>
    <p>Strategy, words and websites for brands in the Gulf and Asia.</p>
    <div class="cta mono"><a class="btn solid" href="../portfolio.html">See the work</a><a class="btn" href="../lets-talk.html">Let's talk</a></div>
  </div>
</section>
<section class="rest"><p>The rest of the home page continues here. Hover a print to lift it and play its film; each print opens its case study.</p></section>
<script src="shell.js"></script>
<script src="pieces.js"></script>
<script>
(() => {
  const mast = document.getElementById('mast'), mobile = innerWidth <= 900;
  // [left %, top %, width vw, rotation, depth]
  const DESK = [[51,13,21,-3,.16],[76,11,15,4,.26],[69,42,20,2,.1],[48,55,16,-5,.3],[86,53,13,-2,.2],[30,72,16,3,.34],[62,76,14,-1,.18],[7,76,14,-4,.28],[81,79,14,5,.22],[45,84,11,3,.4],[92,27,10,6,.3],[-3,92,11,-6,.3]];
  const MOB = [[4,58,44,-3,.2],[52,57,44,3,.3],[22,68,46,-1,.12],[-8,79,40,4,.3],[58,77,42,-4,.22],[20,88,44,2,.35]];
  const slots = mobile ? MOB : DESK, pieces = PIECES.slice(0, slots.length);
  const prints = pieces.map((p, i) => {
    const [x, y, w, r, d] = slots[i];
    const el = document.createElement('div');
    el.className = 'print';
    Object.assign(el.style, { left: x + '%', top: y + '%', width: w + 'vw', zIndex: 10 + Math.round(d * 10) });
    el.innerHTML = `<a class="card" href="${CS + p.cs}" style="transform:rotate(${r}deg)"><span class="ph"><img src="${A + p.img}" alt="${p.title}">${p.vid ? `<video muted loop playsinline preload="none" data-src="${A + p.vid}"></video>` : ''}</span><span class="cap mono">${p.year} &middot; ${p.title}</span></a>`;
    mast.appendChild(el);
    const v = el.querySelector('video');
    if (v) {
      el.addEventListener('mouseenter', () => { if (!v.src) v.src = v.dataset.src; v.play().catch(() => {}); });
      el.addEventListener('mouseleave', () => v.pause());
    }
    return { el, p, d, r };
  });
  // Prints drop onto the table one by one and develop as they land.
  prints.forEach(({ el, r }, i) => {
    const card = el.querySelector('.card'), img = el.querySelector('img');
    if (reduceMotion) return;
    card.animate([
      { transform: `translate(${(Math.random() - .5) * 60}px,-70px) rotate(${r * 3}deg) scale(1.12)`, opacity: 0, boxShadow: '0 60px 80px -20px rgba(40,30,20,.3)' },
      { transform: `rotate(${r}deg)`, opacity: 1 }
    ], { duration: 900, delay: 200 + i * 130, easing: 'cubic-bezier(.2,.8,.25,1)', fill: 'backwards' });
    developEl(img, 2600, 350 + i * 130);
  });
  // The pencil marks up three prints, each with its confirmed figure.
  const marked = prints.filter(pr => pr.p.note).slice(0, mobile ? 1 : 3);
  const T = reduceMotion ? 0 : 200 + prints.length * 130 + 1300;
  marked.forEach((pr, k) => setTimeout(() => {
    const r = pr.el.getBoundingClientRect(), m = mast.getBoundingClientRect(), pad = 16;
    const w = r.width + pad * 2, h = r.height + pad * 2;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'pencil'); svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    Object.assign(svg.style, { left: r.left - m.left - pad + 'px', top: r.top - m.top - pad + 'px', width: w + 'px', height: h + 'px' });
    svg.innerHTML = `<path d="${loop(w, h, k)}"/>`;
    pr.el.appendChild(svg); Object.assign(svg.style, { left: -pad + 'px', top: -pad + 'px' });
    drawPath(svg.firstChild, 750);
    const note = document.createElement('span');
    note.className = 'note'; note.textContent = pr.p.note;
    Object.assign(note.style, { left: '4px', top: `calc(100% + ${pad + 8}px)` });
    pr.el.appendChild(note);
    setTimeout(() => note.classList.add('on'), reduceMotion ? 0 : 600);
  }, T + k * 900));
  // Depth: prints drift apart on scroll and lean away from the cursor, each by its own amount.
  let mx = 0, my = 0;
  addEventListener('mousemove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; frame(); });
  addEventListener('scroll', frame, { passive: true });
  function frame() {
    if (reduceMotion) return;
    prints.forEach(({ el, d }) => { el.style.transform = `translate3d(${(-mx * d * 40).toFixed(1)}px,${(-scrollY * d - my * d * 30).toFixed(1)}px,0)`; });
  }
})();
</script>
</body>
</html>
